features:
  window: 30
  horizon: 5
  technical:
  - ma
  - rsi
  - macd
  - volatility
  - volume_ratio
model:
  type: lstm
  hidden_size: 64
  num_layers: 2
  dropout: 0.2
  lr: 0.001
  epochs: 50
  batch_size: 64
  patience: 8
  seed: 42
  device: auto
# 横截面增强模型（v2，2026-09-02 升级：相对标签 + 截面/Alpha101 特征 + 多模型集成）
# 根因：旧 LSTM 学"单股绝对涨跌"≈抛硬币(acc~0.5)，与"选股=横截面排序"任务错配。
# 有该段时 API/重训优先使用 v2；想回退旧模型，删除/改名 results/model_v2 即可。
model_v2:
  enabled: true
  dir: results/model_v2
  label_mode: relative        # relative = 未来 horizon 跑赢全池当日中位数(截面) | absolute = 未来绝对涨跌
  cross_features: true        # 加当日截面分位特征 rank_close/rank_volume/rank_ret1/rank_ret5
  alpha_features: true        # 加 Alpha101 + 自动挖掘精选因子（与 17_factor_mine 共享算子库）
  members: [lstm, transformer, gbm]   # 集成成员：lstm / transformer / gbm（至少 1 个）
  gbm:
    n_estimators: 800         # LightGBM（缺失时回退 sklearn HistGradientBoosting）
    learning_rate: 0.05
    num_leaves: 63
    max_depth: 8
    min_child_samples: 40
    subsample: 0.9
    colsample_bytree: 0.8
backtest:
  initial_capital: 100000.0
  commission: 0.0003
  slippage: 0.0002
  stamp_tax: 0.0005    # 印花税（卖出单边，2023.8 起 0.05%）
  threshold: 0.55
  position_pct: 0.95
  risk_free: 0.02      # 无风险利率（年化），用于夏普/Alpha/Treynor/Sortino
manual:
  initial_capital: 100000.0
  db_path: paper/manual_account.db
  max_order_shares: 10000
  enforce_trading_hours: true   # 闭市/休市禁止下单（仅交易日 9:30-11:30 / 13:00-15:00）
  lot_size: 100                # A股买入整手（100 股整数倍）
# 实盘炒股账户（本金 ¥3000 · 模型只给「建议」· 人工在券商 App 下单后回来记账）。
# ⚠️ 程序绝不自动下单、不接入任何券商 API（故无需程序化交易报备）；本段与上面两个账户完全隔离。
real:
  enabled: true
  initial_capital: 3000.0
  db_path: paper/real_account.db
  lot_size: 100                # A股整手（买入须 100 股整数倍）
  max_order_shares: 2000       # 单笔上限（¥3000 本金下足够）
  enforce_trading_hours: true  # 只约束「建议」时效；记账不受限（成交回报常在盘后补录）
  # ---- 仓位政策：¥3000 只够 2 只；默认组合逻辑的 5 只/单票20% 完全不适用 ----
  max_positions: 2             # 持仓上限
  target_position_pct: 0.95    # 目标总仓位
  max_stock_pct: 0.50          # 单票市值上限（2 仓 → 每只 ≤50%）
  single_position_pct: 0.90    # 仅空仓且无第二只可负担时，放宽单只上限（例外，界面会注明）
  # ---- 费用（真实口径：单笔最低佣金 ¥5 是 ¥3000 账户的主要成本）----
  commission: 0.0003           # 佣金 万3
  min_commission: 5.0          # 单笔最低佣金 ¥5（买卖各收一次）
  stamp_tax: 0.0005            # 印花税（卖出单边 0.05%）
  transfer_fee: 0.00001        # 过户费（双边 0.001%）
  slippage: 0.0                # 按人工回报的成交价记账，不加滑点
  # 往返费用需涨幅 > 该值 → 不建议（低价股/小额单的费用占比过高）。
  # 2026-09-11 收紧 1.5 → 1.2：实测（554 只可买票 × 43 万笔）毛均收益仅 +0.96%，
  # 而往返费用拖累 1.82pp（¥729 小单 = 1.42%，几乎全是"最低佣金 ¥5"）——费用才是净收益
  # 的主要杀手，且与止损宽窄无关。故按费用效率过滤：约名义 ≥¥870（1 手 ≥¥8.7 或 2 手 ≥¥4.35）。
  max_breakeven_pct: 1.2
  min_order_amount: 500.0      # 单笔金额下限（低于此费用占比过大）
  # 成交可行性判定（严格档）——阈值见 quant/trading/fill.py:FillConfig
  fill:
    drift_tol_pct: 1.0         # 现价 vs 参考价漂移 > 1% → 需改价方能成交（hard）
    miss_tol_pct: 2.0          # 漂移 > 2% → 已错过
    touch_tol_pct: 0.3         # 委托价贴近当日已触及区间边缘 → 降级 likely
    near_limit_pct: 0.5        # 距涨跌停 ≤0.5% → 封板风险
    depth_ratio: 1.0           # 盘口量/建议股数 < 该值 → 可能部分成交
    open_grace_min: 5          # 开盘后前 N 分钟漂移阈值放宽（集合竞价跳空）
  # 建议参数（stop/take 为实盘建议线；空表示沿用全局 risk 段）
  advice:
    n: 3                       # 最多输出 3 条买入建议（2 仓位 + 备选）
    # 入场择时（只改「何时下手」，不改「选谁」）：现价高于 5 日均线 → 不追，标成「等回踩」。
    # 实证（552只·2020-2026·顶部12只·T+1开盘买持5日）：加闸门后均收益 0.06%→0.50%，
    # 7 年中 6 年有效、两个半段均有效（2023 年是唯一失效年 -0.37% vs -0.09%），属
    # 「多数时候有帮助的温和杠杆」而非稳赚；故不硬过滤，只降级为"等回踩"并给出触发价。
    entry_gate: true
    stop_loss_pct: 0.08
    take_profit_pct: 0.10
    trailing_pct: 0.08
    use_selection: true        # 候选来源 = 每日选股 topN（同组合调仓）；false = 40 只模型池
auto_refresh:
  enabled: true
  check_interval_minutes: 30
  update_time: '15:30'
  auto_rebalance: true
  # 收盘后自动维护 600 池 + 影子 A/B（scripts 26→27→28）：服务在 run_time 时刻挂着才跑，
  # 没挂当日跳过（符合“本地无法 24h 挂服务”约束）。run_time 需在 40 池收盘刷新
  # (update_time 15:30)之后 —— 先保证 market.db 的 40 只今天已就绪，26 补大池、
  # 27 才能在完整 ~599 截面上打分。比“等 Claude 17:17 定时”提前约 1.5h；
  # Claude 定时保留为兜底 + STABLE 提醒。
  shadow_ab:
    enabled: true
    run_time: '15:45'     # 触发时刻（15:00 收盘 → 15:30 40池刷新 → 15:45 自动跑）
    grace_min: 120        # 触发点过后仍允许补跑（服务开晚了也在当天内补）；超过则当日跳过
    # 行情源的「当日日线」常在收盘后一段时间才发布（2026-09-11 实测：15:46 拿到 0 行、
    # 16:55 才拿到 558 行）→ 跑完校验大池库是否推进到今天，没有就等一会重试；
    # **只有校验通过才写 logs/shadow_ab_date 标记**（否则兜底定时会误判"服务已跑"而跳过补跑）。
    retry_interval_min: 10   # 未拿到当日日线时的重试间隔（分钟）
    retry_until: '18:30'     # 重试截止时刻；到点仍未拿到则本日不写 marker，留给兜底定时
    # scripts/26 的大池拉取并发。akshare 新浪日线每 worker 起一个 py_mini_racer(V8) 上下文，
    # 内存占用高：服务在跑(约1GB)再叠加并发易触发 V8 FATAL(partition_address_space) 崩溃
    # （2026-09-10 实测：可用内存仅 854MB 时 workers=4 秒崩、=1 正常）。故自动流水线取 2。
    workers: 2
    recent: 700           # scripts/27 每只取最近 N 交易日打分（控耗时）
selection:
  auto: true        # 每日选股：收盘后随自动刷新运行（寻找大盘优质股）
  n: 12             # 展示优质股数量
  universe: large   # 候选宇宙：large=现池40∪中小盘缓存~560（600只实证低波动/反转所在）| hs300=仅沪深300
  # regime 门控：按市场状态(沪深300近20日趋势)切换技术面因子权重——实证(29号)价量 alpha 是
  # 条件性的：下跌市 低波+60日反转 最强(RankIC0.12/超额+1.4%)，上涨市 低波/反转 负暴露 → 动量主导。
  # 权重表见 quant/data/selector.py: TECH_REGIME_WEIGHTS；false = 恒用默认(动量25/趋势15/低波30/反转30)
  regime_gating: true
realtime:
  enabled: true
  interval_seconds: 10
  sources:
  - sina
  - tencent
minute:
  enabled: true
  scale: 5
  refresh_interval: 60
  datalen: 1023
  db_path: data/minute.db
  concurrency: 4
trading:
  max_positions: 5
  # 自动纸面盘「多日持有」双阈值（quant/trading/engine.py）：
  #   掉出核心榜但概率仍 ≥ clear_threshold → 保留 hold_trim 成观察仓（部分减持，不清仓）
  #   跌破 clear_threshold（或无当日信号）→ 全仓卖出
  #   设 null 回到旧「掉榜即清」模式（每期整仓轮动）
  clear_threshold: 0.45
  hold_trim_pct: 0.5
  minute_adj: 0.05   # 盘中分钟模型对综合分的修正强度（方向化，buy +0.05 / sell -0.05）
  # 组合/一键调仓的「交易候选」来源：
  #   selection = 今日选股 topN（600 只大池，基本面+低波动+60日反转实证因子）——主推
  #   model40   = 旧逻辑：40 只训练池按模型综合分 topN（可随时回退）
  candidate_source: selection
portfolio_risk:
  market_weak_threshold: -1.0   # 大盘(沪深300)当日跌幅低于此值(%) → 弱势，降仓
  weak_position_pct: 0.5        # 弱势时总仓位上限（占资产比例）
  max_stock_pct: 0.20           # 单票仓位上限（避免重仓单票）
  # 分钟否决买入：默认关闭！分钟模型概率极端未校准（常 0.002~0.006 恒判 sell），
  # 若开启会把盘中所有买入目标都 skip（一键调仓"卖出能成交、买入全被拦"）。
  # 待分钟模型校准/重训后再置 true；期间靠 大盘弱势降仓 + 单票上限 兜底。
  minute_veto: false            # true=盘中分钟 sell 暂停买入该目标 | false=只做方向化微调(±minute_adj)
  # ---- 账户回撤熔断（2026-09-11，看"自己亏多少"而非"大盘跌多少"）----
  # 净值自近 window_days 高点回撤 ≥ trip_pct → 总仓位降到 position_pct 且停开新仓；
  # 回撤收窄到 release_pct 以内解除（滞回防抖，状态持久化 logs/drawdown_brake.json）。
  # 实证（600池top12等权·2020-2026·含换手费）：最大回撤 −51.4% → −32.5%、年化 −0.7% → +0.9%；
  # 再叠加弱势减半 → +1.3%/Sharpe 0.18。更紧的 6%/3% 并不更好（8%/4% 为本样本最佳）。
  drawdown_brake:
    enabled: true
    window_days: 60
    trip_pct: 8.0          # 回撤 ≥8% 触发
    release_pct: 4.0       # 回到 4% 以内解除（滞回区 [4%,8%) 维持原状态）
    position_pct: 0.5      # 触发期间总仓位上限
    block_new_buys: true   # 触发期间不开新仓
  # 弱势主动减仓（2026-09-11）：大盘弱势/熔断时，把「超出目标仓位」的持仓减持到目标。
  # 原实现只"限制新买"、对已持有且超目标的只判 hold → 弱势日仓位一分不降（见 docs）。
  weak_trim: true
  # 追高/接飞刀保护：组合调仓「新买/加仓」前，按 现价vs昨收 的当日涨跌幅拦截
  chase_guard:
    enabled: true
    high_limit_pct: 2.0        # 涨幅 > 该值 → 追高，跳过买入（专治盘中买在最高点）
    drop_limit_pct: -3.0       # 跌幅 < 该值 → 急跌接飞刀，跳过买入
  # 回测式执行模式：'live'=现状(盘中实时价随时可调) | 'open'=仅开盘窗口可调、用参考价=昨收×(1+open_premium_pct)
  exec_mode: live
  open_window_minutes: 15      # open 模式下，开盘后前 N 分钟为可执行窗口（9:30 起）
  open_premium_pct: 0.5        # open 模式委托价相对昨收的溢价（%，近似开盘成交/回测口径）
  # 自动开盘执行：服务在开盘时刻(9:30+delay_sec)正运行时，自动执行一次组合调仓（每日一次）
  # 人工窗口易吃盘中波动（如东鹏开盘15分钟内大涨）——由机器在开盘瞬间自动触发更贴近开盘价。
  # 服务当时没开 → 当日不自动跑（符合“无法 24h 挂服务”约束）；手动“一键调仓”不受影响。
  auto_open_execute:
    enabled: true             # 服务在 9:31 前后运行 → 自动执行一次组合调仓（防手动错过开盘）
    delay_sec: 60              # 9:30 后延迟秒数再触发（留出集合竞价→连续竞价过渡）
    grace_min: 25              # 触发点过后仍允许补跑的分钟数（防线程启动略晚）
risk:
  enabled: true
  stop_loss_pct: 0.08
  take_profit_pct: 0.08   # 固定回退止盈（无 vol 时用）：保守 ≈+8% 落袋
  trailing_stop: true
  trailing_pct: 0.08
  # 按波动率动态止盈止损（ATR 自适应）：不同波动股票用不同宽窄的止损/止盈
  dynamic_volatility: true
  vol_window: 20          # ATR 计算窗口（日）
  atr_stop_mult: 3.0      # 止损 = 成本 - 3.0 × ATR（2.5 曾致高波动周期股被反复震出，放宽到 3）
  atr_take_mult: 2.5      # 止盈 = 成本 + 2.5 × ATR（保守锁盈：赢利 ≈+6~8% 即落袋）
  atr_trailing_mult: 2.5  # 移动止损 = 高点 - 2.5 × ATR
  vol_min_pct: 0.03       # 止损百分比下限（低波动股不设过窄）
  vol_max_pct: 0.15       # 止损百分比上限（高波动股不设过宽）
  take_min_pct: 0.05      # 止盈百分比下限
  take_max_pct: 0.30      # 止盈百分比上限
  # 长假前降仓：长假开始前的最后交易日自动把目标仓位上限降到 reduce_to_pct，规避跨长假跳空风险
  pre_holiday:
    enabled: true
    min_days_off: 3        # 自明日起连续休市(周末+法定假日) ≥ N 天 → 视为长假
    reduce_to_pct: 0.5     # 长假前目标仓位上限（0.5 = 50%）
    # ⭐ 当年 A股法定休市日（只列“非周末”的休市日即可，周末自动算），形如：
    #   holiday_dates: ["2026-10-01", "2026-10-02", ...]
    # 交易所每年末公布次年休市安排，需每年维护一次；留空则本功能不生效
    #（“未来”休市无法从行情推断，必须靠这份清单知道长假要来了）。
    holiday_dates: []
api:
  host: 127.0.0.1
  port: 8001
